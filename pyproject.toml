[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shadowcam-ssl-denoising"
version = "0.1.0.dev0"
description = "Self-supervised denoising for ShadowCam imagery in lunar permanently shadowed regions"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Prasun Mahanti" },
]
dependencies = [
    "torch>=2.2",
    "torchvision>=0.17",
    "pytorch-lightning>=2.2",
    "wandb>=0.16",
    "numpy>=1.26",
    "scipy>=1.12",
    "scikit-image>=0.22",
    "bm3d>=4.0",
    "matplotlib>=3.8",
    "pillow>=10.0",
    "tqdm>=4.66",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.3",
    "black>=24.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
